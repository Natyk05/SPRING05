services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: curso_springboot
      POSTGRES_USER: ${DB_USERNAME:?Define DB_USERNAME en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  cliente-service:
    build: .
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: ${DB_URL:?Define DB_URL en .env}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?Define DB_USERNAME en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${JPA_DDL:?Define JPA_DDL en .env}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: